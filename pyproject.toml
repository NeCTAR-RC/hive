[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "hive"
# Version is derived from the git tag at build time by setuptools-scm; see
# [tool.setuptools_scm] below. Listed in `dynamic` so it is not set statically.
dynamic = ["version"]
description = "Hive: the Nectar Research Cloud dashboard (React SPA + FastAPI backend-for-frontend)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "ARDC Nectar Core Services" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis[hiredis]>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.9",
    "structlog>=24",
    "prometheus-client>=0.19",
    "sentry-sdk[fastapi]>=2",
    "defusedxml>=0.7",
    "python-dateutil>=2.9",
    "cryptography>=42",
    "PyYAML>=6",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
    "fakeredis>=2.26",
]

[project.scripts]
hive-web = "hive.web.app:main"

[tool.setuptools_scm]
# No options needed: derive the version from the git tag (e.g. 0.1.0) of the
# checked-out commit. Untagged builds get a dev version like 0.1.1.devN+g<sha>.

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["hive*"]

[tool.setuptools.package-data]
hive = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
markers = [
    "live: needs HIVE_TEST_CRED and network access to the rctest cloud",
    "contract: checks the Horizon /rest_api/ allocation contract on rctest",
]
addopts = "-m 'not live and not contract'"

[tool.coverage.run]
source = ["hive"]

[tool.coverage.report]
# Keep the default "# pragma: no cover" behaviour and also drop unreachable __main__ glue.
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 79
# see https://github.com/astral-sh/ruff/issues/4560
ignore = ["E712"]

[tool.ruff.format]
quote-style = "preserve"
docstring-code-format = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "U"]
