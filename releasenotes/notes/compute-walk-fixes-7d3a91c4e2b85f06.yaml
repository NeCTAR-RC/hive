---
features:
  - |
    The launch wizard offers a configuration drive and loading the
    customisation script from a file, filters the flavours by name and
    shows their ephemeral disk.
  - |
    The launch wizard stops at the Count field when the count does not
    fit the project's instance quota, and at the Networks step when
    several instances would share one existing port.
  - |
    The instance menu adds Attach volume, Detach volume and a Rescue
    that picks its image, groups its actions into sections and says what
    Shelve and Hard reboot do. Associate floating IP is disabled for an
    instance with no port behind a router, and can allocate a new
    floating IP on the way. The instance list marks locked instances and
    has a Task column; the Security groups tab lists each group's rules
    and the Interfaces tab can edit a port.
  - |
    Most lists keep their page, page size and sort in the URL, so the
    back button returns to the same place, and a search that finds
    nothing offers "Clear search". Form dialogs open with focus on their
    first field, and a server error goes once the user edits the form.
  - |
    Images can become a volume from their menu, and the image edit
    dialog edits the description and custom properties; the image page
    shows its checksum. A duplicate key pair name is caught before it is
    sent. A server group's page has its actions menu, and the compute
    overview shows the volume and network quotas beside the compute
    ones.
fixes:
  - |
    The two "Resume instance" actions read apart: the one that undoes a
    pause is "Unpause instance".
