[tox]
# The whole gate: the Python envs, then the frontend's lint, unit tests,
# build and end-to-end suite (the frontend envs need node 26+ and pnpm on
# PATH).
# `tox -m python` or `tox -m frontend` runs one side only.
envlist = py314,pep8,typecheck,deps,frontend-lint,frontend-unit,frontend-build,e2e
labels =
    python = py314,pep8,typecheck,deps
    frontend = frontend-lint,frontend-unit,frontend-build,e2e
skipsdist = False

[testenv]
usedevelop = True
extras = test
passenv =
    HIVE_TEST_CRED
commands =
    pytest {posargs:backend/tests} --cov=hive --cov-report=term-missing
    {[floors]commands}

# The security core (login, sessions, and the client base every upstream
# call goes through) is held to 95% each, above the 90% overall floor.
[floors]
commands =
    coverage report --format=total --include=*/hive/auth/* --fail-under=95
    coverage report --format=total --include=*/hive/session/* --fail-under=95
    coverage report --format=total --include=*/hive/clients/base.py --fail-under=95

[testenv:pep8]
description = Run style checks.
skip_install = true
deps = pre-commit
# The frontend lint has its own env (frontend-lint), so pep8 needs no node.
set_env =
    SKIP = frontend-lint
commands = pre-commit run --all-files --show-diff-on-failure

[testenv:typecheck]
description = Type-check the backend package with pyright (basic mode).
deps = pyright==1.1.414
commands = pyright --pythonpath {envpython} backend/hive

# The hashed runtime lock the image installs. `lock` rewrites it after a
# dependency change in pyproject.toml; `deps` fails when it is stale.
[testenv:lock]
description = Regenerate requirements.lock from pyproject.toml.
skip_install = true
deps = uv==0.13.1
commands =
    uv pip compile pyproject.toml --universal --generate-hashes --python-version 3.12 --custom-compile-command "tox -e lock" -o requirements.lock --quiet

[testenv:deps]
description = Fail when requirements.lock no longer matches pyproject.toml.
skip_install = true
deps = uv==0.13.1
allowlist_externals =
    cp
    diff
commands =
    cp requirements.lock {envtmpdir}/requirements.lock
    uv pip compile pyproject.toml --universal --generate-hashes --python-version 3.12 --custom-compile-command "tox -e lock" -o {envtmpdir}/requirements.lock --quiet
    diff -u requirements.lock {envtmpdir}/requirements.lock

[testenv:releasenotes]
deps = reno
commands = reno lint

# Coverage run: HTML + XML reports under cover/, enforcing a floor.
[testenv:cover]
description = Run unit tests with coverage; write HTML + XML reports and enforce a floor.
commands =
    coverage erase
    pytest {posargs:backend/tests} --cov=hive --cov-report=term-missing:skip-covered --cov-report=html:cover --cov-report=xml:cover/coverage.xml --cov-fail-under=90
    {[floors]commands}

# Live tests run against the rctest cloud using the credentials file named by
# HIVE_TEST_CRED (same format as test-cred: `export OS_*=...`).
[testenv:live]
description = Run the live tests against rctest (needs HIVE_TEST_CRED).
commands =
    pytest {posargs:backend/tests/live} -m live -o addopts=""

[testenv:contract]
description = Check the Horizon /rest_api/ allocation contract (needs HIVE_TEST_CRED).
commands =
    pytest {posargs:backend/tests/contract} -m contract -o addopts=""

# The frontend (the web SPA in frontend/), one env per gate so CI reports
# each on its own, plus `frontend` for all three. They shell out to pnpm,
# so they need node 26+ and a global pnpm on PATH (pnpm switches itself to
# the packageManager pin in frontend/package.json; node 25+ no longer ships
# corepack). ARDC_HOOKS=0 keeps `pnpm install` from installing the
# developer's git hooks; CI=1 gives the e2e suite its CI settings (one
# worker, retries that still fail the run, an HTML report to archive).
[frontend]
allowlist_externals = pnpm
set_env =
    ARDC_HOOKS = 0
install = pnpm install --frozen-lockfile

[testenv:frontend]
description = Lint, unit-test and build the web SPA (requires node 26 + pnpm).
skip_install = true
change_dir = frontend
allowlist_externals = {[frontend]allowlist_externals}
set_env = {[frontend]set_env}
commands =
    {[frontend]install}
    pnpm lint
    pnpm test
    pnpm build

[testenv:frontend-lint]
description = Lint the web SPA: eslint, stylelint, prettier, design tokens.
skip_install = true
change_dir = frontend
allowlist_externals = {[frontend]allowlist_externals}
set_env = {[frontend]set_env}
commands =
    {[frontend]install}
    pnpm lint

[testenv:frontend-unit]
description = Run the web SPA's unit tests (vitest).
skip_install = true
change_dir = frontend
allowlist_externals = {[frontend]allowlist_externals}
set_env = {[frontend]set_env}
commands =
    {[frontend]install}
    pnpm test

[testenv:frontend-build]
description = Type-check and build the web SPA, with the bundle budget.
skip_install = true
change_dir = frontend
allowlist_externals = {[frontend]allowlist_externals}
set_env = {[frontend]set_env}
commands =
    {[frontend]install}
    pnpm build

[testenv:e2e]
description = Run the Playwright end-to-end suite against the mocked build.
skip_install = true
change_dir = frontend
allowlist_externals = {[frontend]allowlist_externals}
set_env =
    {[frontend]set_env}
    CI = 1
commands =
    {[frontend]install}
    pnpm test:e2e:install
    pnpm test:e2e

[flake8]
show-source = True
# H = hacking, I = flake8-import-order. ruff owns formatting and E/F/U lint, so
# pycodestyle E/W stay deselected here; E203 is listed anyway as it conflicts with
# ruff-format's slice spacing should E ever be enabled.
select = H,I
# H102: no per-file license headers (LICENSE at the repo root covers it).
ignore = E203,H102,H301,H403,H404,H405
import-order-style = pep8
application-import-names = hive,tests
