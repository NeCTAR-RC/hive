# Local container smoke test: redis + the hive image.
#
#   make build && VERSION=0.0.0 docker compose up
#   python scripts/dev-login.py --target http://localhost:8080/auth/websso/
#
# `make dev` is the day-to-day loop (API with reload + Vite); this file only
# proves the built image runs. `redis` alone is also what `make dev` starts.
services:
  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  hive:
    build:
      context: .
      args:
        VERSION: '${VERSION:-0.0.0}'
    env_file:
      - .env
    environment:
      HIVE_REDIS_URL: redis://redis:6379/0
      HIVE_PUBLIC_URL: http://localhost:8080
      HIVE_COOKIE_SECURE: 'false'
    ports:
      - '8080:8080'
    depends_on:
      redis:
        condition: service_healthy
