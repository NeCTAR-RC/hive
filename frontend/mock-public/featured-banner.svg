<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <!-- The mocked featured banner's picture: served by the mock build only,
       so the mocked home page loads no picture from the network. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="0.6" stop-color="#14365f"/>
      <stop offset="1" stop-color="#1f5a7a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#5fd0c8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5fd0c8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#sky)"/>
  <rect width="1600" height="600" fill="url(#glow)"/>
  <g fill="none" stroke="#7fe0d8" stroke-opacity="0.35" stroke-width="3">
    <path d="M980 120 H1180 V220 H1380"/>
    <path d="M1000 300 H1240 V380 H1480"/>
    <path d="M1040 470 H1200 V420 H1420"/>
  </g>
  <g fill="#7fe0d8" fill-opacity="0.6">
    <circle cx="1380" cy="220" r="8"/>
    <circle cx="1480" cy="380" r="8"/>
    <circle cx="1420" cy="420" r="8"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.08">
    <rect x="1120" y="150" width="200" height="300" rx="12"/>
    <rect x="1160" y="190" width="120" height="16" rx="4"/>
    <rect x="1160" y="230" width="120" height="16" rx="4"/>
    <rect x="1160" y="270" width="120" height="16" rx="4"/>
  </g>
</svg>
